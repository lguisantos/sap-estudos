name: Validar conteúdo

on:
  push:
    paths: ["content/**", "scripts/validar.mjs"]
  pull_request:
    paths: ["content/**", "scripts/validar.mjs"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validar.mjs
